<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Interactive visual study guide for NSW HSC Physics (Stage 6, 2017 syllabus) Modules 5–8: simulations, formulas, worked solutions and exam practice." />
    <meta name="theme-color" content="#0b1120" />
    <title>HSC Physics 2026 — Interactive Visual Study Guide</title>
    <script>
      // apply saved theme before first paint to avoid a flash
      try {
        var p = JSON.parse(localStorage.getItem('hscphys.prefs') || '{}');
        var dark = p.theme ? p.theme === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
